# =============================================================================
# ENGINEERING & OSS
# Shipping work: open-source contributions and production systems.
# Fields:
#   title       : project name
#   description : one or two sentences
#   org         : optional institute / company line
#   dates       : optional engagement dates — rendered with org as "org · dates"
#   link        : optional GitHub repo URL — shown as a bracketed [GitHub] link
#   image       : optional thumbnail override (compact one-line rows are the
#                 default here; add an image + template only if ever needed)
#   template    : "compact" (default — title, one-line description, GitHub pill)
#                 or "detailed" (thumbnail + description)
# =============================================================================

- title: "React Headless Token Auth"
  description: "Open-source contribution to a headless React authentication library. Token expiration was breaking sessions silently — I fixed the expiry handling with setTimeout and an expiration context, then improved the developer experience with new hooks, contexts, and Axios request interceptors that attach and refresh tokens automatically. All work went upstream through reviewed pull requests alongside general code reviews and maintenance."
  link: "https://github.com/aagam41"

- title: "Django Dynamic Models"
  description: "Contribution to django-dynamic-models, a library that creates Django models at runtime instead of in source code — useful for metadata-driven systems like our archival platform. I resolved long-standing stability bugs around dynamic model registration, closed five issues, landed three accepted pull requests, and rewrote the contributor documentation."
  link: "https://github.com/aagam41"

- title: "Django DB File Storage"
  description: "Fork-and-patch of django-db-file-storage, which stores uploaded files in the database rather than on the filesystem. I migrated the codebase to Django 4.x and fixed NameException crashes caused by Windows path-separator logic — a patch submitted upstream and publicly credited by the Berlin Institute of Health."
  link: "https://github.com/aagam41"

- title: "SPAPAS — Student Prediction and Performance Analysis System"
  description: "A Django-based system using linear and logistic regression to predict student performance and visualize insights through dashboards for data-driven academic evaluation."
  org: "Government Polytechnic Ahmedabad"
  dates: "Jan–Mar 2021"
