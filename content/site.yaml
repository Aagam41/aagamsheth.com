# =============================================================================
# SITE.YAML — master control file
# =============================================================================
# Edit this file to:
#   - change your name, bio, photo, and contact links in the header
#   - reorder sections (just reorder the list under "sections")
#   - rename a section's display title
#   - hide a section without deleting its content (set enabled: false)
#   - change which default template a section uses for its entries
#
# Each entry under "sections" points to a content file in /content/
# and a template folder in /templates/. You do not need to touch any
# other file to reorder or rename sections.
# =============================================================================

site:
  title: "Aagam Sheth"
  meta_description: "Aagam Sheth — Master's student in Computer Science at Ahmedabad University, working on computer vision and applied machine learning. CTO at Tirth Infotech."

header:
  name: "Aagam Sheth"
  tagline: "I'm a Master's student in Computer Science at Ahmedabad University, advised by JB Sir, working on computer vision, deep learning architectures, and applied ML systems. I'm also the CTO at [Tirth Infotech](https://github.com/aagam41), where I've spent the last several years building and deploying production systems for government and enterprise clients."
  photo: "assets/img/headshot.jpg"
  email: "contact.me@aagamsheth.com"
  links:
    - label: "CV"
      url: "assets/files/cv-placeholder.pdf"
    - label: "GitHub"
      url: "https://github.com/aagam41"
    - label: "LeetCode"
      url: "https://leetcode.com/u/Aagam41/"
    - label: "Kaggle"
      url: "https://www.kaggle.com/aagamsheth"

# -----------------------------------------------------------------------------
# SECTIONS — order in this list = order on the page.
# -----------------------------------------------------------------------------
# id            : internal id, used for the file name lookup + anchor link (#id)
# title         : heading shown on the page
# enabled       : true/false — false hides the section entirely
# content_file  : yaml file in /content/ holding this section's entries
# template_dir  : folder in /templates/ holding this section's .hbs templates
# default_template : which .hbs file (without extension) to use if an entry
#                     doesn't specify its own "template:" field
# sort          : "date" (newest first, uses each entry's "date" field)
#                 or "manual" (use the order entries appear in the yaml file)
# -----------------------------------------------------------------------------

sections:
  - id: news
    title: "News"
    enabled: true
    content_file: "content/news.yaml"
    template_dir: "templates/news"
    default_template: "default"
    sort: "date"

  - id: education
    title: "Education"
    enabled: true
    content_file: "content/education.yaml"
    template_dir: "templates/education"
    default_template: "default"
    sort: "manual"

  - id: publications
    title: "Publications"
    enabled: true
    content_file: "content/publications.yaml"
    template_dir: "templates/publications"
    default_template: "detailed"
    sort: "date"

  - id: projects
    title: "Projects"
    enabled: true
    content_file: "content/projects.yaml"
    template_dir: "templates/projects"
    default_template: "detailed"
    sort: "manual"

  - id: experience
    title: "Experience"
    enabled: true
    content_file: "content/experience.yaml"
    template_dir: "templates/experience"
    default_template: "default"
    sort: "manual"

  - id: skills
    title: "Skills"
    enabled: true
    content_file: "content/skills.yaml"
    template_dir: "templates/skills"
    default_template: "default"
    sort: "manual"

  - id: other
    title: "Other"
    enabled: true
    content_file: "content/other.yaml"
    template_dir: "templates/other"
    default_template: "default"
    sort: "manual"

  - id: certificates
    title: "Certificates"
    enabled: true
    content_file: "content/certificates.yaml"
    template_dir: "templates/certificates"
    default_template: "default"
    sort: "date"

  - id: contact
    title: "Contact"
    enabled: true
    content_file: "content/contact.yaml"
    template_dir: "templates/contact"
    default_template: "default"
    sort: "manual"
