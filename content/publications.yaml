# =============================================================================
# PUBLICATIONS
# Fields:
#   date      : YYYY-MM-DD (used for sorting, newest first)
#   title     : paper title
#   authors   : list of author names. Put "**Your Name**" in bold via markdown-style **
#               to highlight yourself (rendered automatically as bold).
#   venue     : e.g. "CVPR 2025 (Oral)"
#   image     : teaser image path (every publication row shows a thumbnail;
#               if left out, a placeholder box with the title is rendered)
#   links     : list of {label, url} — shown as [label] pills
#   template  : "detailed" (image + full author list) or "compact" (text-only, one line)
# =============================================================================

