# =============================================================================
# OTHER — freeform personal section (hobbies, misc interests, etc).
# Fields:
#   text     : short lead line, markdown-style [links](https://url.com) supported
#   items    : list of short interest strings — rendered as compact pills so
#              the section stays scannable instead of a text wall
#   template : optional template override
# =============================================================================

- text: "Outside of research and work:"
  items:
    - "Reading"
    - "Photography"
    - "Guitar & other instruments"
    - "Cycling — happy to swap good routes around Ahmedabad"
    - "Brewing coffee — always up for talking pour-over ratios"
  template: "default"
