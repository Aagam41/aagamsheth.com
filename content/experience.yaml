  logo: "assets/img/logo-tirth-infotech.png"
  description: "Recruitment exams attract objections by the thousand, and this platform is where candidates file them and boards resolve them. I developed the Django + MS SQL Server system deployed on AWS behind Apache Httpd and mod_wsgi, then made it fast: profiling showed a cryptographic hash burning CPU on every request, so a custom XOR integrity check replaced it — roughly 70% CPU saved across all eight cores and headroom for about 5,000 requests per minute on a single instance. Hot queries moved to Transact-SQL stored procedures, Django was hardened for thread safety under Apache MPM Prefork (10 processes x 100 threads), and I still maintain the system today."
  template: "default"

