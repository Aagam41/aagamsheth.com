# =============================================================================
# EXPERIENCE — grouped LinkedIn-style: one header per company (org), then
# roles beneath it. The first entry of each org renders the logo + name;
# `context` optionally names the client/project for that role.
# Fields:
#   date        : YYYY-MM-DD — kept for reference, not used while sort is "manual"
#   dates_label : human-readable range, e.g. "2026 - Present"
#   role        : job title
#   org         : company — consecutive entries with the same org are grouped
#                 under a single header
#   context     : optional client / project line under the role title
#   logo        : path shown next to the company header
#   description : one or two sentences on what you did/shipped
#   template    : optional template override
# =============================================================================

