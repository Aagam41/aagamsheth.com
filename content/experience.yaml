  logo: "assets/img/logo-tirth-infotech.png"
  description: "Architected and shipped the Archives Portal for the Gujarat State Archives and the Food and Drugs Control Administration, hosted on the Gujarat State Data Centre across three servers in a DMZ topology — one machine each for the Django/DRF application, PostgreSQL, and MongoDB. Built dynamic, metadata-driven APIs and admin panels so any archival schema can be modelled without code changes, added Gujarati full-text search over TsVector lexemes, RFC 7233 ranged downloads for large documents, and hash-table caching on hot client and server paths. The platform cleared two security audits by a CERT-In empanelled auditor and remains in production."
