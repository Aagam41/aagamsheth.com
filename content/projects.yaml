# =============================================================================
# PROJECTS
# Fields:
#   title       : project name
#   description : one or two sentences
#   link        : optional GitHub repo URL — shown as a [GitHub] link
#   image       : optional path to a project thumbnail image. If left out,
#                 a placeholder box showing the project title is shown
#                 instead. Hover over any thumbnail to see it full-size.
#   template    : "detailed" (thumbnail + description + GitHub link)
