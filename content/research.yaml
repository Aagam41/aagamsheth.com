  template: "detailed"

- title: "Early Sepsis Detection from Electronic Health Records"
  description: "Early sepsis prediction on MIMIC-IV ICU records: clinical feature engineering, SMOTE balancing, and LightGBM/XGBoost ensembles tuned for recall — 0.921 ROC-AUC, 0.812 PR-AUC, ~83.6% recall, explained with SHAP."
