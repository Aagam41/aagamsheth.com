- title: "Small Object Detection & Tracking for UAV Videos"
  description: "YOLOv11 with SAHI tiling feeds a contrastively-trained Siamese Re-ID head, tuned via Bayesian hyperparameter search (Optuna) — false positives down 21.5% on small objects in UAV footage."
